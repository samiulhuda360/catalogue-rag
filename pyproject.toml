[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "catalogue-rag"
version = "1.0.0"
description = "Cited answers from product catalogues: table-aware chunking, hybrid BM25 + embedding retrieval, and an evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samiul Huda" }]
dependencies = [
  "chromadb>=0.5",
  "openai>=1.50",
  "fastapi>=0.110",
  "uvicorn>=0.24",
  "pydantic>=2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
parse = ["llama-cloud>=2.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
catalogue-rag = "catalogue_rag.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"eval/baseline/*" = ["B", "E", "F", "W", "I"]  # the whole-document baseline, kept unchanged on purpose
